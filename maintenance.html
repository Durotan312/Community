<!DOCTYPE html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="10">
<title>Connected Community — технические работы</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#F4F5F7;font-family:'Segoe UI',Arial,sans-serif;color:#1B1F24;padding:20px;box-sizing:border-box;}
.card{background:#fff;border-radius:20px;padding:40px 44px;max-width:460px;text-align:center;border-top:5px solid #FF6B00;box-shadow:0 10px 40px rgba(0,0,0,.08);}
h1{font-size:23px;margin:0 0 12px;}
p{font-size:15px;line-height:1.55;color:#5B636D;margin:0;}
.brand{font-weight:800;color:#FF6B00;letter-spacing:.02em;margin-bottom:18px;font-size:15px;}
.dots{display:flex;gap:8px;justify-content:center;margin-top:24px;}
.dots i{width:10px;height:10px;border-radius:50%;background:#FF6B00;animation:d 1.2s infinite ease-in-out;}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes d{0%,80%,100%{opacity:.25;transform:scale(.8)}40%{opacity:1;transform:scale(1.15)}}
@media (prefers-color-scheme:dark){body{background:#121417;color:#ECEEF0}.card{background:#1E2227;box-shadow:none}p{color:#A0A6AD}}
</style></head>
<body><div class="card">
<div class="brand">CONNECTED COMMUNITY</div>
<h1>Ведутся технические работы</h1>
<p>Портал обновляется и вернётся через пару минут.<br>Страница откроется сама — ничего нажимать не нужно.</p>
<div class="dots"><i></i><i></i><i></i></div>
</div></body></html>
