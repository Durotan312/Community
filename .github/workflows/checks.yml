name: Проверки

on:
  pull_request:
  push:
    branches: [master]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements.txt
      - name: Правила интерфейса и синтаксис
        run: python checks/rules.py
      - name: Портал запускается
        run: python checks/ci_smoke.py
